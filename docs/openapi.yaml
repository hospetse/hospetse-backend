openapi: 3.1.0
info:
  title: Hospetse Back-end
  version: 0.1.0
  description: |
    API do back-end do Hospetse. O README traz o contexto de cada rota (decisões, idempotência, pendências).
    Erros seguem `{ code, message, details? }`; o formato definitivo depende da #56.

    **Autenticação (#298):** tudo sob `/api/v1` é protegido por padrão, antes de chegar na rota.
    `/api/v1/internal/*` exige o token de serviço do Auth; o resto exige o JWT do usuário.
    Sem autenticação válida, qualquer caminho sob `/api/v1` responde `401`, inclusive os que não existem.
    Sob `/api/v1/admin` (#313), usuário autenticado sem o papel Administrador responde `403`, inclusive nos caminhos que não existem.

    **Inventário das rotas públicas** (as únicas com `security: []`): `GET /health`, `GET /health/ready`,
    `GET /docs` (esta documentação) e `GET /docs/openapi.yaml` (este arquivo).
    Uma rota pública nova precisa entrar aqui e na lista `PUBLIC_ROUTES` do `test/auth-guard.test.js`.
servers:
  - url: https://backend-production-7298.up.railway.app
    description: Produção (Railway)
  - url: http://localhost:3000
    description: Desenvolvimento local

# Padrão: JWT do usuário. As rotas públicas e a interna declaram o próprio security.
security:
  - userJwt: []

tags:
  - name: Saúde
    description: Liveness e readiness
  - name: Documentação
    description: Esta documentação
  - name: Interno
    description: Chamadas só pelo Auth Server
  - name: Usuário
    description: Rotas do app, autenticadas pelo JWT do usuário
  - name: Host
    description: Consulta de Hosts pelo Tutor e rotas do próprio Host
  - name: Provider
    description: Cadastro de Pet Sitter e Pet Walker (#342)
  - name: Administração
    description: Exigem o papel Administrador (#313)
  - name: Contratação
    description: Exigem conta ativa e perfil complete (#263). service-requests e checkout seguem provisórias até as tasks de reserva e checkout
  - name: Pagamento
    description: Integração com o Stripe em modo de teste (ADR-016)
  - name: Conversa
    description: Conversa entre Tutor e prestador, uma por contratação (#548). O envio e a entrega das mensagens em tempo real são pelo WebSocket em /ws (#551), descrito em docs/websocket.md

paths:
  /health:
    get:
      tags: [Saúde]
      operationId: getHealth
      summary: Liveness
      description: Só confirma que o processo responde; não acessa o banco.
      security: []
      responses:
        '200':
          description: Processo no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: Server is running }

  /health/ready:
    get:
      tags: [Saúde]
      operationId: getReadiness
      summary: Readiness
      description: Executa `SELECT 1` no banco com limite de 2 segundos; nunca escreve.
      security: []
      responses:
        '200':
          description: Banco respondendo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  database: { type: string, example: ok }
        '503':
          description: Banco indisponível ou lento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  database: { type: string, example: unavailable }

  /docs:
    get:
      tags: [Documentação]
      operationId: getDocs
      summary: Página do Swagger UI com este contrato
      security: []
      responses:
        '200':
          description: Página HTML
          content:
            text/html:
              schema: { type: string }

  /docs/openapi.yaml:
    get:
      tags: [Documentação]
      operationId: getOpenApi
      summary: Este contrato em YAML
      security: []
      responses:
        '200':
          description: OpenAPI 3.1
          content:
            text/yaml:
              schema: { type: string }

  # Retorno do gateway (#528): fora do /api/v1, sem JWT. Autenticado pela assinatura Stripe-Signature, sobre o corpo bruto.
  /webhooks/stripe:
    post:
      tags: [Pagamento]
      operationId: receiveStripeWebhook
      summary: Recebe os eventos de pagamento do Stripe (#528)
      description: |
        Chamado só pelo Stripe. Única rota de escrita fora do `/api/v1`: o guard global exigiria JWT, e quem prova a origem é a assinatura.
        - `payment_intent.succeeded`: a transação vai para `approved`, um lançamento é gravado e a contratação sai de `awaiting_payment` para `accepted`, com notificação ao prestador.
        - `payment_intent.payment_failed`: a transação vai para `rejected`, um lançamento é gravado e a contratação continua em `awaiting_payment`.
        - Outros tipos, eventos repetidos ou de pagamentos desconhecidos: 200 sem efeito.

        Os lançamentos (`financial_entries`) são só de inserção: não existe rota de alteração nem de exclusão.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Assinatura HMAC do corpo, gerada pelo Stripe com o segredo do endpoint (`STRIPE_WEBHOOK_SECRET`)
          schema: { type: string }
      requestBody:
        required: true
        description: Evento do Stripe (`id` evt_..., `type` e `data.object` com o PaymentIntent). Lido como corpo bruto
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Evento recebido (processado, repetido ou ignorado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, const: true }
        '400':
          description: '`WEBHOOK_SIGNATURE_INVALID`: assinatura ausente, inválida ou antiga. Nada é alterado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: '`INTERNAL_ERROR`: o Stripe reenvia o evento mais tarde'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/PaymentGatewayUnavailable' }

  /api/v1/internal/users/{authUserId}:
    put:
      tags: [Interno]
      operationId: provisionUser
      summary: Provisiona o USER a partir do Auth Server (#259)
      description: Idempotente pelo `authUserId`. A autenticação é verificada antes do body.
      security:
        - serviceToken: []
      parameters:
        - name: authUserId
          in: path
          required: true
          description: '`user_auth.id` do Auth, que também vai no `sub` do JWT'
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: USER criado agora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionedUser' }
        '200':
          description: USER já existia com o mesmo authUserId e e-mail (retentativa)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`SERVICE_TOKEN_INVALID`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`EMAIL_ALREADY_IN_USE` ou `AUTH_USER_ID_CONFLICT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me:
    get:
      tags: [Usuário]
      operationId: getMe
      summary: Estado do usuário e do perfil (#262)
      security:
        - userJwt: []
      responses:
        '200':
          description: Token válido e USER encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      authUserId: { type: string, format: uuid }
                      email: { type: string, format: email }
                      name: { type: string }
                  profile:
                    type: object
                    properties:
                      status: { type: string, enum: [incomplete, complete] }
                      missingFields:
                        type: array
                        description: Campos do perfil do Tutor ainda vazios; sem TUTOR, todos aparecem
                        items: { type: string, enum: [cpf, birthDate, phone, address, emergencyContact] }
                  permissions:
                    type: object
                    properties:
                      canSearch: { type: boolean }
                      canContract:
                        type: boolean
                        description: '`true` só com perfil complete e conta que não esteja blocked ou suspended'
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /api/v1/admin/me:
    get:
      tags: [Administração]
      operationId: getAdminMe
      summary: Confirma o papel Administrador do usuário autenticado (#313)
      security:
        - userJwt: []
      responses:
        '200':
          description: Usuário com o papel Administrador
          content:
            application/json:
              schema:
                type: object
                required: [id, accountType]
                properties:
                  id: { type: string, format: uuid }
                  accountType: { type: string, enum: [admin] }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  # Validação de prestadores: JWT do usuário → papel Administrador → controller.
  /api/v1/admin/provider-validations:
    get:
      tags: [Administração]
      operationId: listProviderValidations
      summary: Fila de cadastros de prestador aguardando validação (#398)
      description: |
        Só cadastros com situação `pending`, do envio mais antigo para o mais novo (`submittedAt`, com desempate por `providerId`).
        Por enquanto só existem Hosts (`hotel`): Pet Sitter e Pet Walker entram com a #342, e o filtro já aceita os três tipos.
        A fila não traz documento nem link: os arquivos só saem no detalhe.
      security:
        - userJwt: []
      parameters:
        - name: providerType
          in: query
          description: Sem o parâmetro, lista todos os tipos
          schema: { type: string, enum: [hotel, pet_sitter, pet_walker] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página da fila; lista vazia quando não há cadastro pendente
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderValidationItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de cadastros pendentes com o filtro aplicado }
              example:
                items:
                  - providerId: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f
                    providerType: hotel
                    name: Hotel X
                    submittedAt: '2026-11-09T12:00:00.000Z'
                    documentCount: 3
                    photoCount: 4
                page: 1
                pageSize: 20
                total: 1
        '400':
          description: '`VALIDATION_ERROR`: `providerType`, `page` ou `pageSize` inválidos, parâmetro fora do contrato ou repetido. Todos os erros de uma vez'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Parâmetros inválidos
                details:
                  - { field: providerType, message: 'um de: hotel, pet_sitter, pet_walker' }
                  - { field: pageSize, message: inteiro de 1 a 50 }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/provider-validations/{providerId}:
    get:
      tags: [Administração]
      operationId: getProviderValidation
      summary: Detalhe de um cadastro pendente, com os documentos protegidos (#398)
      description: |
        Cada documento sai por um link temporário, gerado a cada requisição e válido por `expiresIn` segundos
        (`STORAGE_SIGNED_URL_SECONDS`, padrão 300). O link não deve ser guardado. A chave do arquivo nunca sai na resposta.
        CPF ou CNPJ sai mascarado e, do titular, nenhum dado de conta.
        [assunção] O endereço sai sem rua e sem número (minimização). Se os critérios de análise (#396) pedirem o endereço
        completo para conferir o comprovante, ele entra depois.
        [assunção] O registro de quem visualizou os documentos fica para depois da #396, que fecha a regra da LGPD.
      security:
        - userJwt: []
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cadastro pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderValidationDetail' }
        '400':
          description: '`VALIDATION_ERROR`: `providerId` não é UUID'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Parâmetros inválidos
                details:
                  - { field: providerId, message: UUID obrigatório }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404':
          description: '`NOT_FOUND`: cadastro inexistente ou que não está `pending` (mesma resposta, para não revelar aprovado, rejeitado nem rascunho). `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Cadastro não encontrado }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /api/v1/admin/provider-validations/{providerId}/approve:
    post:
      tags: [Administração]
      operationId: approveProvider
      summary: Aprova um cadastro pendente (#404)
      description: |
        Vai para `approved` uma única vez: o prestador passa a aparecer na busca e nos detalhes públicos e a receber solicitações.
        Autor (o Administrador do token), data e o evento `provider_validation_approved` para o prestador
        (entrega pela HSP-PBI-064) são gravados na mesma transação. Sem body.
      security:
        - userJwt: []
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cadastro aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderValidationDecision' }
              example: { providerId: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, validationStatus: approved, decidedAt: '2026-11-14T12:00:00.000Z', rejectionReason: null }
        '400': { $ref: '#/components/responses/ProviderIdInvalid' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404': { $ref: '#/components/responses/ProviderNotFound' }
        '409': { $ref: '#/components/responses/ProviderAlreadyDecided' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/provider-validations/{providerId}/reject:
    post:
      tags: [Administração]
      operationId: rejectProvider
      summary: Reprova um cadastro pendente com motivo (#404)
      description: |
        Vai para `rejected` uma única vez. O motivo fica disponível ao prestador em `GET /api/v1/me/host` (`rejectionReason`).
        Autor, data, motivo e o evento `provider_validation_rejected` para o prestador são gravados na mesma transação.
        [assunção] O reenvio do cadastro reprovado não existe ainda.
      security:
        - userJwt: []
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: Espaços nas pontas são removidos }
            example: { reason: Comprovante de endereço ilegível }
      responses:
        '200':
          description: Cadastro reprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderValidationDecision' }
              example: { providerId: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, validationStatus: rejected, decidedAt: '2026-11-14T12:00:00.000Z', rejectionReason: Comprovante de endereço ilegível }
        '400':
          description: '`VALIDATION_ERROR`: `providerId` não é UUID, `reason` ausente, vazio ou com mais de 500 caracteres, ou campo fora do contrato'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: reason, message: 'obrigatório, até 500 caracteres' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404': { $ref: '#/components/responses/ProviderNotFound' }
        '409': { $ref: '#/components/responses/ProviderAlreadyDecided' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Consulta de usuários: JWT do usuário → papel Administrador → controller.
  /api/v1/admin/users:
    get:
      tags: [Administração]
      operationId: listAdminUsers
      summary: Lista os usuários da plataforma, com busca e filtros (#580)
      description: |
        Do cadastro mais novo para o mais antigo (`createdAt`, com desempate por `id`). Os filtros se somam.
        O e-mail sai mascarado (LGPD), mesmo quando a busca foi feita por ele.
      security:
        - userJwt: []
      parameters:
        - name: q
          in: query
          description: Parte do nome ou do e-mail, sem diferenciar maiúsculas de minúsculas. Espaços nas pontas são ignorados
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: role
          in: query
          description: '`tutor`: tem perfil de Tutor. `provider`: tem cadastro de prestador, em qualquer situação. `admin`: conta com o papel Administrador'
          schema: { type: string, enum: [tutor, provider, admin] }
        - name: status
          in: query
          description: 'Estado da conta. [assunção] valores de hoje; a #413 revê os estados da conta.'
          schema: { type: string, enum: [active, blocked, suspended, pending] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de usuários; lista vazia quando nenhum combina com os filtros
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUserItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de usuários com os filtros aplicados }
              example:
                items:
                  - id: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f
                    name: Lucas
                    emailMasked: l***@outlook.com.br
                    accountType: user
                    roles: [tutor]
                    status: active
                    createdAt: '2026-11-09T12:00:00.000Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          description: '`VALIDATION_ERROR`: `q`, `role`, `status`, `page` ou `pageSize` inválidos, parâmetro fora do contrato ou repetido. Todos os erros de uma vez'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Parâmetros inválidos
                details:
                  - { field: q, message: texto de 2 a 100 caracteres }
                  - { field: role, message: 'um de: tutor, provider, admin' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/users/{id}:
    get:
      tags: [Administração]
      operationId: getAdminUser
      summary: Detalhe de um usuário, com papéis, contratações e penalidades (#580)
      description: |
        E-mail, CPF, CNPJ e telefone saem mascarados (LGPD). Endereço, data de nascimento e contato de emergência não saem.
        `contracts` traz as 20 solicitações mais recentes do usuário, como Tutor e como prestador.
        [assunção] Sem paginação no detalhe: as contratações param em 20 e as penalidades saem todas.
        [assunção] As ocorrências (`occurrences`) ficam fora da resposta até a #413 modelar os estados da conta,
        as ocorrências e as penalidades. Até lá, valem os estados e as penalidades de hoje.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '400':
          description: '`VALIDATION_ERROR`: `id` não é UUID'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Parâmetros inválidos
                details:
                  - { field: id, message: UUID obrigatório }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotAdmin' }
        '404':
          description: '`NOT_FOUND`: não existe usuário com esse `id`. `USER_NOT_FOUND`: o usuário do token não foi encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Usuário não encontrado }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/tutor-profile:
    put:
      tags: [Usuário]
      operationId: putTutorProfile
      summary: Conclui ou edita o perfil do Tutor (#275)
      description: |
        Grava endereço, Tutor e USER `complete` em uma transação. Na primeira chamada cria o TUTOR; nas seguintes, atualiza.
        O usuário vem só do `sub` do JWT. Depois do `204`, o app chama o `/me`.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TutorProfile' }
      responses:
        '204':
          description: Perfil gravado e marcado como complete. Sem corpo (o CPF nunca volta em resposta).
        '400':
          description: Todos os campos inválidos, incluindo CPF já usado por outro usuário. O valor recebido não volta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: cpf, message: CPF já cadastrado }
                  - { field: birthDate, message: idade mínima de 18 anos }
                  - { field: address.zipCode, message: deve ter 8 dígitos }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/hosts/search:
    get:
      tags: [Host]
      operationId: searchHosts
      summary: Busca ofertas de hospedagem compatíveis com o pet e o período (#476)
      description: |
        Basta estar autenticado (`canSearch`). Só Host elegível: `provider_type` hotel, `status` active e `validation_status` approved,
        com serviço ativo. Todos os filtros são opcionais e se somam. Sem filtro, lista todas as ofertas elegíveis.
        Compatibilidade do pet: espécie, porte e raça contra as listas aceitas pelo Host. Lista vazia aceita tudo; a comparação
        não diferencia maiúsculas; Host que restringe um campo recusa pet sem esse dado.
        Com período: some o Host com dia bloqueado no período ou sem vaga em algum dia. Ocupam vaga as reservas aguardando pagamento,
        aceitas ou em andamento, até a capacidade do Host (1 se não cadastrada). O dia da saída não conta.
        São as mesmas regras do `POST /api/v1/reservations`. Ordem: menor diária primeiro, desempate pelo `serviceId`.
        Parâmetros fora do contrato são recusados. CPF/CNPJ, e-mail, telefone e endereço completo nunca aparecem (LGPD).
      security:
        - userJwt: []
      parameters:
        - { name: city, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: 'Cidade do Host, sem diferenciar maiúsculas' }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 }, description: Diária mínima em reais }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 }, description: Diária máxima em reais; não pode ser menor que minPrice }
        - { name: startDate, in: query, schema: { type: string, format: date }, description: 'Entrada (YYYY-MM-DD), a partir de hoje; junto com endDate' }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: 'Saída (YYYY-MM-DD), depois de startDate; junto com startDate' }
        - name: petId
          in: query
          schema: { type: string, format: uuid }
          description: |
            Pet ativo do próprio Tutor; espécie, porte e raça vêm dele. Não pode vir junto com `species`, `size` ou `breed`.
            Pet de outro Tutor, inativo, inexistente ou usuário sem perfil de Tutor responde igual: 400 em `petId`.
        - { name: species, in: query, schema: { type: string, enum: [dog, cat] }, description: 'Espécie informada à mão, sem petId' }
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large] }, description: 'Porte informado à mão, sem petId' }
        - { name: breed, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: 'Raça informada à mão, sem petId; sem diferenciar maiúsculas' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Ofertas compatíveis, menor diária primeiro. Lista vazia quando nada combina
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSearchResult' }
        '400':
          description: |
            Todos os parâmetros inválidos de uma vez, incluindo os fora do contrato, os repetidos, `petId` junto com filtros manuais,
            só uma das datas e pet que não é do Tutor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Parâmetros inválidos
                details:
                  - { field: maxPrice, message: não pode ser menor que minPrice }
                  - { field: endDate, message: obrigatório junto com startDate }
                  - { field: size, message: não pode vir junto com petId }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/hosts/{id}:
    get:
      tags: [Host]
      operationId: getHostDetails
      summary: Detalhes públicos de um Host (#479)
      description: |
        Dados que o Tutor vê antes de solicitar. Só Host elegível: `provider_type` hotel, `status` active e `validation_status` approved.
        Documentos, CPF/CNPJ, e-mail, telefone e endereço completo nunca aparecem (LGPD).
      security:
        - userJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Host elegível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetails' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: |
            `NOT_FOUND`: Host inexistente, pendente, rejeitado, inativo ou id fora do formato UUID. A mesma resposta para todos,
            para não revelar que o Host existe. Também `USER_NOT_FOUND`, quando o token é válido mas não há USER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Host não encontrado }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/pets:
    post:
      tags: [Usuário]
      operationId: createPet
      summary: Cadastra um pet do Tutor (#369)
      description: |
        Exige ser Tutor (perfil concluído pelo `PUT /api/v1/me/tutor-profile`). O pet fica vinculado ao Tutor do `sub` do JWT;
        um `tutorId` no body é recusado como campo fora do contrato.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '201':
          description: Pet criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: Todos os campos inválidos, incluindo valor fora do domínio. Nenhum pet é criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: species, message: 'um de: dog, cat' }
                  - { field: birthDate, message: não pode ser no futuro }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Usuário]
      operationId: listPets
      summary: Lista os pets ativos do Tutor (#369)
      description: Só os pets do Tutor do `sub` do JWT; nunca de outro Tutor.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de pets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Pet' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de pets ativos do Tutor }
        '400':
          description: '`page` ou `pageSize` fora do intervalo'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/pets/{id}:
    put:
      tags: [Usuário]
      operationId: updatePet
      summary: Atualiza um pet ativo do Tutor
      description: Substitui o pet inteiro, com as mesmas regras do cadastro. Campo opcional omitido volta a ser `null`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '200':
          description: Pet atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: Payload inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/PetNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Usuário]
      operationId: deletePet
      summary: Desativa um pet do Tutor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Pet desativado }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/PetNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Rotas do próprio Host: JWT do usuário → controller (exige ser Host).
  /api/v1/me/host/reservations:
    get:
      tags: [Host]
      operationId: listHostReservations
      summary: Lista reservas pendentes, confirmadas ou em andamento do Host (#485, #536)
      description: |
        Só as solicitações dos serviços do Host do `sub` do JWT, da mais antiga para a mais nova.
        Antes do check-in, do Tutor sai apenas o nome. O telefone e o endereço só aparecem ao Host responsável em reservas em andamento com check-in registrado.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [requested, accepted, checked_in], default: requested }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de reservas no estado selecionado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostReservation' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de solicitações do Host nesse status }
        '400':
          description: '`status`, `page` ou `pageSize` inválidos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/reservations/{id}/check-in:
    patch:
      tags: [Host]
      operationId: checkInHostReservation
      summary: Registra o check-in da hospedagem (#536)
      description: Só o Host responsável pode registrar uma reserva confirmada a partir da data de início (dia UTC). A operação não recebe body.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Check-in realizado e notificação registrada para o Tutor.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, checkedInAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: checked_in }
                  checkedInAt: { type: string, format: date-time }
        '400':
          description: Body ou parâmetros de consulta fora do contrato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404':
          description: Reserva inexistente ou de outro Host.
        '409':
          description: Reserva não confirmada ou já registrada (RESERVATION_NOT_CONFIRMED), ou data de início ainda não atingida (CHECK_IN_TOO_EARLY).
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/reservations/{id}/check-out:
    patch:
      tags: [Host]
      operationId: checkOutHostReservation
      summary: Conclui a hospedagem em andamento (#545)
      description: O Host responsável encerra a hospedagem. Não recebe body nem parâmetros de consulta. Requer pagamento aprovado e o valor da taxa registrado na solicitação.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hospedagem concluída, valor líquido registrado e notificação gravada.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, checkedOutAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: completed }
                  checkedOutAt: { type: string, format: date-time }
        '400':
          description: Parâmetros fora do contrato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404':
          description: Reserva inexistente ou de outro Host.
        '409':
          description: Reserva fora de andamento (RESERVATION_NOT_IN_PROGRESS), sem taxa histórica (PLATFORM_FEE_UNAVAILABLE) ou sem pagamento aprovado (APPROVED_PAYMENT_REQUIRED).
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/reservations/{id}/accept:
    post:
      tags: [Host]
      operationId: acceptHostReservation
      summary: Aceita uma solicitação pendente (#491)
      description: |
        Vai para `awaiting_payment` (aguardando o pagamento do Tutor, HSP-DEC-004) se ainda houver vaga no período.
        Ocupam vaga as reservas do Host em `awaiting_payment`, `accepted` ou `checked_in` que cruzam o período (o dia da saída não conta).
        Host sem capacidade cadastrada atende um pet por vez [provisório].
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Solicitação aceita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDecision' }
              example: { id: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, status: awaiting_payment, decidedAt: '2026-10-30T12:00:00.000Z', rejectionReason: null }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/ReservationNotFound' }
        '409':
          description: |
            `RESERVATION_ALREADY_DECIDED`: já aceita ou recusada, inclusive quando outra decisão chegou antes ao mesmo tempo.
            `NO_CAPACITY`: algum dia do período já está com todas as vagas do Host ocupadas (a ocupação é contada dia a dia).
            `PET_ALREADY_BOOKED`: o pet já foi aceito por outro Host num período que se cruza com este.
            `PERIOD_UNAVAILABLE`: algum dia do período está bloqueado na agenda do Host, mesmo que o bloqueio seja posterior à solicitação (#482).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/reservations/{id}/reject:
    post:
      tags: [Host]
      operationId: rejectHostReservation
      summary: Recusa uma solicitação pendente com motivo (#491)
      description: Vai para `rejected` e registra o evento `reservation_rejected` para o Tutor na mesma transação (entrega pela FT-026).
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
            example: { reason: Lotado no feriado }
      responses:
        '200':
          description: Solicitação recusada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDecision' }
              example: { id: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, status: rejected, decidedAt: '2026-10-30T12:00:00.000Z', rejectionReason: Lotado no feriado }
        '400':
          description: '`reason` ausente, vazio ou com mais de 500 caracteres, ou campo fora do contrato'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/ReservationNotFound' }
        '409':
          description: '`RESERVATION_ALREADY_DECIDED`: já aceita ou recusada'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Cadastro de Pet Sitter e Pet Walker (#342): mesmo fluxo de rascunho e arquivos do Host.
  /api/v1/me/provider:
    put:
      tags: [Provider]
      operationId: saveCareProviderDraft
      summary: Salva o rascunho de Pet Sitter ou Pet Walker (#342)
      description: |
        Salva dados parciais do cadastro do usuário identificado pelo JWT; não envia o perfil para análise.
        A primeira chamada cria o rascunho (`draft`) e as seguintes atualizam o mesmo registro, preservando campos omitidos.
        O tipo não pode mudar. Aceita somente Pet Sitter e Pet Walker; Host usa `/api/v1/me/host`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareProviderDraftInput' }
      responses:
        '200':
          description: Rascunho salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareProviderProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409': { description: Cadastro já enviado, tipo diferente ou gravação concorrente }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Provider]
      operationId: getCareProviderProfile
      summary: Consulta o cadastro de Pet Sitter ou Pet Walker do usuário
      responses:
        '200':
          description: Cadastro do usuário, com documento mascarado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareProviderProfile' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { description: Cadastro inexistente ou usuário não encontrado }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/provider/submit:
    post:
      tags: [Provider]
      operationId: submitCareProviderProfile
      summary: Envia o rascunho para validação (#342)
      description: |
        Depois dos PUTs e uploads, o app chama esta rota quando o usuário confirma o envio. Não recebe body,
        não cria outro prestador e usa os dados já salvos no rascunho do usuário autenticado.
        Exige CPF/CNPJ correspondente ao tipo de pessoa, descrição, endereço, raio, espécies e portes aceitos, resposta sobre medicamentos,
        faixa de experiência, ao menos uma foto, `identity` e `proof_of_address`; PJ exige `cnpj_card`.
        Devolve todos os campos faltantes de uma vez, sem alterar o rascunho. Cadastro válido fica `pending` e fora das buscas.
      responses:
        '200':
          description: Cadastro enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareProviderProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { description: Cadastro inexistente ou usuário não encontrado }
        '409': { description: Cadastro já enviado }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/provider/documents:
    post:
      tags: [Provider]
      operationId: addCareProviderDocument
      summary: Envia documento ao rascunho do prestador
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [type, file]
              properties:
                type: { type: string, enum: [identity, proof_of_address, cnpj_card, qualification] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Documento guardado; chave privada não é exposta }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { description: Cadastro inexistente ou usuário não encontrado }
        '409': { description: '`PROVIDER_ALREADY_SUBMITTED` ou `FILE_LIMIT_REACHED`' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /api/v1/me/provider/documents/{id}:
    get:
      tags: [Provider]
      operationId: getCareProviderDocumentLink
      summary: Link temporário do próprio documento
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Link temporário para o titular }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { description: Documento inexistente ou de outro usuário }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/provider/photos:
    post:
      tags: [Provider]
      operationId: addCareProviderPhoto
      summary: Envia foto ao rascunho do prestador
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Foto guardada; até 10 fotos }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { description: Cadastro inexistente ou usuário não encontrado }
        '409': { description: '`PROVIDER_ALREADY_SUBMITTED` ou `FILE_LIMIT_REACHED`' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /api/v1/me/provider/availability:
    get:
      tags: [Provider]
      operationId: getCareProviderAvailability
      summary: Consulta área, horários e preço do próprio Sitter ou Walker (#561)
      description: |
        Só o prestador aprovado consulta. Sem `date`, `busyIntervals` é vazio; com `date`, inclui horários de contratações
        aguardando pagamento, confirmadas ou em andamento naquele dia. Horários são locais de America/Sao_Paulo.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: Dia para consultar horários ocupados }
      responses:
        '200': { description: Configuração e intervalos ocupados, content: { application/json: { schema: { $ref: '#/components/schemas/CareAvailability' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { description: Prestador ainda não aprovado ou inativo }
        '404': { description: Cadastro de Sitter ou Walker inexistente }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Provider]
      operationId: saveCareProviderAvailability
      summary: Substitui área, horários e preço do próprio Sitter ou Walker (#561)
      description: |
        Só o prestador aprovado configura. Uma cidade e bairros dessa cidade; `serviceNeighborhoods: []` atende a cidade inteira.
        [assunção #561] O raio salvo no cadastro não filtra a busca enquanto os endereços não tiverem coordenadas.
        Horários semanais não podem se sobrepor. O preço é por visita para Sitter e por passeio para Walker.
        `durationWalkMinutes` é obrigatório apenas para Walker. Se qualquer campo for inválido, nada é alterado.
        A mudança vale para buscas e solicitações novas; valores já registrados nas contratações não mudam.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareAvailabilityInput' }
      responses:
        '200': { description: Configuração salva, content: { application/json: { schema: { $ref: '#/components/schemas/CareAvailability' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { description: Prestador ainda não aprovado ou inativo }
        '404': { description: Cadastro de Sitter ou Walker inexistente }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/providers/search:
    get:
      tags: [Provider]
      operationId: searchCareProviders
      summary: Busca visitas e passeios disponíveis (#561)
      description: |
        Retorna apenas Sitter ou Walker ativo, aprovado e configurado, por menor preço e depois `serviceId`.
        A cidade e o bairro devem coincidir com a área configurada; lista de bairros vazia cobre a cidade inteira.
        Quando `date`, `startTime` e `endTime` são informados, o intervalo deve caber em um horário semanal e não cruzar
        uma contratação aguardando pagamento, confirmada ou em andamento. [assunção #561] Horários em America/Sao_Paulo.
        A criação da solicitação de visita/passeio e a revalidação da disponibilidade pertencem à #564.
      parameters:
        - { name: providerType, in: query, required: true, schema: { type: string, enum: [pet_sitter, pet_walker] } }
        - { name: city, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: neighborhood, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: startTime, in: query, schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { name: endTime, in: query, schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: petId, in: query, schema: { type: string, format: uuid }, description: 'Pet ativo do próprio Tutor; incompatível com species, size ou breed' }
        - { name: species, in: query, schema: { type: string, enum: [dog, cat] }, description: 'Espécie manual sem petId' }
        - { name: size, in: query, schema: { type: string, enum: [small, medium, large] }, description: 'Porte manual sem petId' }
        - { name: breed, in: query, schema: { type: string, minLength: 1, maxLength: 100 }, description: 'Raça manual sem petId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Prestadores compatíveis, content: { application/json: { schema: { $ref: '#/components/schemas/CareSearchResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Cadastro do Host (#325): JWT do usuário → (JSON no PUT) → controller. O dono vem só do JWT.
  /api/v1/me/host:
    put:
      tags: [Host]
      operationId: saveHostDraft
      summary: Salva o rascunho do cadastro do Host (#325)
      description: |
        A primeira chamada cria o rascunho (`draft`) e as seguintes atualizam. `providerType` e `name` são sempre exigidos;
        os outros campos, quando omitidos, ficam como estão. Rascunho não aparece nas consultas públicas nem dá acesso às rotas de Host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostDraftInput' }
      responses:
        '200':
          description: Rascunho salvo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409':
          description: '`HOST_ALREADY_SUBMITTED`: o cadastro já foi enviado e não edita mais. `HOST_DRAFT_CONFLICT`: dois primeiros envios ao mesmo tempo'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Host]
      operationId: getHostProfile
      summary: Cadastro do Host do próprio usuário (#325)
      description: Para o app retomar o rascunho e mostrar a situação da validação. CPF ou CNPJ volta mascarado; a chave dos documentos nunca sai.
      responses:
        '200':
          description: Cadastro do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostProfile' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: o usuário ainda não tem cadastro de Host. `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/submit:
    post:
      tags: [Host]
      operationId: submitHostProfile
      summary: Envia o rascunho para validação (#325)
      description: |
        Exige descrição, CPF ou CNPJ, endereço, capacidade, ao menos uma espécie e um porte, ao menos uma foto e os documentos `identity` e
        `proof_of_address`, além de `cnpj_card` quando for CNPJ. O perfil fica `pending`, fora das consultas públicas até a aprovação,
        e a primeira foto vira a principal. Sem body.
      responses:
        '200':
          description: Cadastro enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostProfile' }
        '400':
          description: Tudo o que falta no cadastro; o rascunho não muda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: o usuário ainda não tem cadastro de Host. `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`HOST_ALREADY_SUBMITTED`: o cadastro já foi enviado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/documents:
    post:
      tags: [Host]
      operationId: addHostDocument
      summary: Envia um documento do cadastro do Host (#325)
      description: |
        Um arquivo por requisição, em rascunho do próprio usuário. O tipo é conferido pelo conteúdo do arquivo: nome e `Content-Type`
        enviados pelo cliente são ignorados. PDF, JPEG ou PNG, até 10 MB e até 5 arquivos por tipo de documento.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [identity, proof_of_address, cnpj_card] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Documento guardado. A chave no armazenamento nunca sai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDocument' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: o usuário ainda não tem cadastro de Host. `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/HostFileConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /api/v1/me/host/documents/{id}:
    get:
      tags: [Host]
      operationId: getHostDocumentLink
      summary: Link temporário de um documento, só para o titular (#325)
      description: O link vale 5 minutos por padrão (`STORAGE_SIGNED_URL_SECONDS`) e não deve ser guardado. O acesso do Administrador entra com o fluxo de validação.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Link temporário
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: documento inexistente ou de outro usuário (mesma resposta, para não revelar que existe). `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/photos:
    post:
      tags: [Host]
      operationId: addHostPhoto
      summary: Envia uma foto do cadastro do Host (#325)
      description: |
        Um arquivo por requisição, em rascunho do próprio usuário. O tipo é conferido pelo conteúdo do arquivo.
        JPEG, PNG ou WebP, até 5 MB e até 10 fotos. A primeira vira a foto principal na submissão.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Foto guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostPhoto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: o usuário ainda não tem cadastro de Host. `USER_NOT_FOUND`: usuário não encontrado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/HostFileConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  # Agenda do Host (#482): JWT do usuário → (JSON no POST) → controller (exige ser Host). O Host vem só do JWT.
  /api/v1/me/host/agenda:
    get:
      tags: [Host]
      operationId: getHostAgenda
      summary: Estado de cada dia da agenda do próprio Host (#482)
      description: |
        Cada dia do período fica `free`, `blocked` ou `occupied`. `blocked` vence `occupied`. O dia é `occupied` quando as reservas
        aguardando pagamento, aceitas ou em andamento chegam à capacidade do Host (1 se não cadastrada), o mesmo critério da busca.
        `endDate` não entra. Sem datas, de hoje até 30 dias; até 90 dias por consulta, passado permitido.
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date }, description: 'Primeiro dia (YYYY-MM-DD); padrão hoje' }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: 'Dia seguinte ao último (YYYY-MM-DD); padrão startDate + 30' }
      responses:
        '200':
          description: Agenda do período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agenda' }
        '400':
          description: Todos os parâmetros inválidos, incluindo os fora do contrato e período maior que 90 dias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/agenda/blocks:
    post:
      tags: [Host]
      operationId: blockHostAgenda
      summary: Bloqueia um período da agenda do próprio Host (#482)
      description: |
        Bloqueia de `startDate` até o dia antes de `endDate`, uma linha por dia. Dia já bloqueado fica como está, com o motivo antigo.
        Recusado se alguma reserva aguardando pagamento, aceita ou em andamento cair no período; solicitação só pendente não impede,
        e o aceite dela passa a ser recusado. Dia bloqueado some da busca e recusa solicitação e aceite com `PERIOD_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockInput' }
            example: { startDate: '2026-11-10', endDate: '2026-11-13', reason: Reforma }
      responses:
        '201':
          description: Todos os dias bloqueados do período, em ordem
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Block' } }
        '400':
          description: Todos os campos inválidos, incluindo passado, fim antes do início, mais de 365 dias e campos fora do contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409':
          description: '`PERIOD_OCCUPIED`: há hospedagem que ocupa algum dia do período; nenhum dia foi bloqueado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/agenda/blocks/{id}:
    delete:
      tags: [Host]
      operationId: unblockHostAgendaDay
      summary: Libera um dia bloqueado do próprio Host (#482)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dia liberado }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404':
          description: '`NOT_FOUND`: bloqueio inexistente, de outro Host ou id fora do formato UUID (mesma resposta). Também `USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Contratação (#263): JWT do usuário → guarda de conta e perfil (só no POST) → controller.
  /api/v1/reservations:
    post:
      tags: [Contratação]
      operationId: createReservation
      summary: Solicita hospedagem de um pet num serviço de um Host (#494)
      description: |
        Cria a solicitação no estado `requested` (pendente, HSP-DEC-004), com o snapshot da diária e do total (diária × noites).
        O servidor também guarda o valor da taxa da plataforma para calcular o líquido no check-out. O total cobrado do Tutor continua sendo `totalValue`.
        O Tutor vem só do `sub` do JWT. O pet precisa ser ativo, do próprio Tutor e aceito pelo Host (espécie, porte e raça;
        lista vazia no Host = aceita tudo). O serviço precisa estar ativo e ser de um Host elegível (o mesmo filtro do `GET /hosts/{id}`).
        Reenviar com a mesma `Idempotency-Key` devolve a mesma solicitação (`200`), sem criar outra.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Gerada pelo app para cada intenção de solicitar e repetida nos reenvios. Até 100 letras, números, `-` ou `_`
          schema: { type: string, pattern: '^[\w-]{1,100}$' }
          example: 9b2f6c1e-4d3a-4f7b-a1c2-3e4d5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '200':
          description: Reenvio da mesma intenção (mesma chave, mesmo body); devolve a solicitação já criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400':
          description: |
            Todos os campos inválidos, incluindo o header `Idempotency-Key`, serviço ou pet inexistentes e pet não aceito pelo Host.
            Pet de outro Tutor responde igual ao inexistente. Nada é gravado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: petId, message: espécie não aceita pelo Host }
                  - { field: endDate, message: deve ser depois de startDate }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409':
          description: |
            `PERIOD_UNAVAILABLE`: algum dia do período está bloqueado na agenda do Host (o dia da saída não conta).
            `NO_CAPACITY`: algum dia do período já está com todas as vagas do Host ocupadas por reservas aguardando pagamento, aceitas ou em andamento.
            `PET_ALREADY_BOOKED`: o pet já tem hospedagem que ocupa algum dia do período, com este ou outro Host.
            `IDEMPOTENCY_KEY_REUSED`: a mesma `Idempotency-Key` já foi usada para outra intenção (outro serviço, pet, período ou observação).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # shortcut: service-requests e checkout ainda não criam nada e respondem 501 para quem passa pela guarda; as tasks de reserva/checkout definem body e sucesso.

  # Pagamento da contratação (#530): JWT do usuário → conta e perfil aptos → JSON → controller.
  /api/v1/contracts/{id}/payment:
    post:
      tags: [Pagamento]
      operationId: payContract
      summary: Paga uma contratação aceita pelo prestador (#530)
      description: |
        O Tutor paga uma contratação em `awaiting_payment` com o token do cartão gerado pelo SDK do Stripe no App (ADR-016).
        Número e CVV nunca chegam ao back-end: o body aceita só `paymentMethodToken`, e qualquer outro campo é recusado.
        O valor é sempre o `totalValue` da contratação, nunca um valor vindo do App.

        **Idempotência:** uma `Idempotency-Key` por tentativa. Reenviar com a mesma chave (toque duplo, timeout) devolve a mesma
        tentativa sem nova cobrança, mesmo que a contratação já tenha sido confirmada. [assunção] Com a mesma chave e outro token,
        vale a tentativa original e o token novo é ignorado. A chave é única por contratação: a mesma chave em outra contratação é outra tentativa.

        **Confirmação:** a contratação só passa para `accepted` pelo webhook (`POST /webhooks/stripe`, #528). Por isso a resposta é 202:
        `status` é o da tentativa (`approved`, `rejected` ou `pending` para 3D Secure ou timeout) e `reservationStatus` é o da contratação no momento.
        Na recusa, a contratação continua em `awaiting_payment` e o Tutor tenta de novo com outra chave e outro cartão.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: path, required: true, description: Id da contratação (reservation), schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          description: Gerada pelo App para cada tentativa de pagamento e repetida nos reenvios. Até 100 letras, números, `-` ou `_`
          schema: { type: string, pattern: '^[\w-]{1,100}$' }
          example: 4c8e2a9d-1f3b-4e6a-9c0d-7b2a1e5f8d34
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentMethodToken]
              properties:
                paymentMethodToken: { type: string, pattern: '^pm_[A-Za-z0-9_]{1,250}$', description: Token do cartão criado pelo Stripe no App, example: pm_card_visa }
      responses:
        '202':
          description: Tentativa registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPayment' }
              example: { transactionId: b3f1c2d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d, status: approved, amount: 240.1, failureCode: null, createdAt: '2026-11-15T14:00:00.000Z', reservationStatus: awaiting_payment }
        '400':
          description: '`VALIDATION_ERROR`: Idempotency-Key ausente ou fora do formato, token inválido ou campo fora do contrato (ex.: `cardNumber`, `cvv`). O valor recusado não volta na resposta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404':
          description: '`NOT_FOUND`: contratação inexistente, de outro Tutor ou id inválido (mesma resposta, para não revelar que existe)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Contratação não encontrada }
        '409':
          description: |
            `RESERVATION_NOT_PAYABLE`: a contratação não está em `awaiting_payment` ou já foi paga. O gateway não é chamado.
            `PAYMENT_IN_PROGRESS`: já existe uma tentativa pendente (outra chave); aguarde o resultado dela.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PaymentGatewayUnavailable' }

    get:
      tags: [Pagamento]
      operationId: getContractPayment
      summary: Comprovante do pagamento da contratação (#530)
      description: |
        A tentativa de pagamento mais recente da contratação, com o status atual da contratação. O App consulta depois do 202
        até a tentativa sair de `pending` e a contratação passar para `accepted` (confirmação pelo webhook, #528).
        Consultar não exige perfil apto (só o JWT): quem não pode mais contratar continua vendo os próprios pagamentos.

        [assunção] O comprovante é a própria tentativa, referenciada pelo `transactionId`. A tela do comprovante é do Mobile (#531)
        e o extrato com todas as movimentações do Tutor é o HSP-PBI-070, fora da Sprint 8.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: path, required: true, description: Id da contratação (reservation), schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tentativa mais recente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPayment' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: contratação inexistente, de outro Tutor, id inválido ou ainda sem pagamento'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Conversa da contratação (#548): JWT do usuário → controller. Abrir conversa não é contratar (fora da guarda de contratação).
  /api/v1/contracts/{id}/conversation:
    post:
      tags: [Conversa]
      operationId: openContractConversation
      summary: Abre ou reabre a conversa da contratação (#548)
      description: |
        Uma conversa por contratação, entre o Tutor que solicitou e o prestador do serviço, disponível desde a solicitação e em qualquer status.
        A primeira abertura responde 201; as seguintes, 200 com o mesmo `id`. Tutor e Host abrindo ao mesmo tempo recebem a mesma conversa.
        `open` é `false` quando a contratação está `completed`, `rejected` ou `cancelled`: o histórico continua visível, mas o envio (#551) é bloqueado.
        Sem body. As mensagens são enviadas pelo canal em tempo real (#551).
      security:
        - userJwt: []
      parameters:
        - { name: id, in: path, required: true, description: Id da contratação (reservation), schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Conversa reaberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Conversa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: |
            `NOT_FOUND`: contratação inexistente, id inválido ou usuário que não participa dela (mesma resposta, sem nenhum dado).
            [assunção] O card pedia 403 `CONVERSATION_FORBIDDEN`; a decisão foi 404, para não revelar que a contratação existe, como no pagamento (#530).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Contratação não encontrada }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/conversations/{id}/messages:
    get:
      tags: [Conversa]
      operationId: listConversationMessages
      summary: Histórico da conversa (#548)
      description: |
        Só para os participantes. A página 1 traz as mensagens mais recentes; dentro de cada página, da mais antiga para a mais nova
        (`sentAt`, com desempate por `id`). Para carregar mensagens anteriores, peça a próxima página.
      security:
        - userJwt: []
      parameters:
        - { name: id, in: path, required: true, description: Id da conversa, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Uma página do histórico
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total, open]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConversationMessage' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  open: { type: boolean, description: 'Se a conversa aceita mensagem nova' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: '`NOT_FOUND`: conversa inexistente, id inválido ou usuário que não participa dela (mesma resposta, sem nenhum dado)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Conversa não encontrada }
        '500': { $ref: '#/components/responses/InternalError' }

  # Minhas contratações (#533): JWT do usuário → controller (só o Tutor, só as dele).
  /api/v1/me/contracts:
    get:
      tags: [Contratação]
      operationId: listMyContracts
      summary: Lista as contratações do Tutor (#533)
      description: |
        Todas as contratações do Tutor autenticado (qualquer pet, prestador e status), da mais recente para a mais antiga
        (data da solicitação, com desempate por `id`). O Tutor vem só do JWT. Filtros por status e período ficam fora da Sprint 8.
        `type` vem do tipo do prestador: `hospedagem` (Host), `visita` (Pet Sitter) e `passeio` (Pet Walker).
        `statusLabel` usa os nomes oficiais do Glossário (Estados da contratação). É a porta de entrada para pagar (#530),
        acompanhar (#542) e conversar (#548).
      security:
        - userJwt: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Uma página das contratações
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyContract' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/service-requests:
    post:
      tags: [Contratação]
      operationId: createServiceRequest
      summary: Inicia uma solicitação de serviço (guarda da #263; criação provisória, a #494 substitui)
      description: A regra também é conferida na camada de service. Consultar (GET) não passa pela guarda.
      responses:
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/checkout:
    post:
      tags: [Contratação]
      operationId: createCheckout
      summary: Inicia um checkout (guarda da #263; criação provisória)
      description: A regra também é conferida na camada de service. Consultar (GET) não passa pela guarda.
      responses:
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Auth (RS256, iss hospetse-auth-service, aud hospetse-backend). O `sub` é o authUserId.
    serviceToken:
      type: http
      scheme: bearer
      description: INTERNAL_SERVICE_TOKEN compartilhado com o Auth (provisório até a #254).

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ValidationError:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string, const: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: 'Campos aninhados com ponto: address.zipCode' }
              message: { type: string }

    ProvisionedUser:
      type: object
      properties:
        userId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }

    Phone:
      type: string
      pattern: '^\d{10,11}$'
      description: Só dígitos, com DDD, sem +55 [assunção]
      example: '11999999999'

    TutorProfile:
      type: object
      additionalProperties: false
      required: [cpf, birthDate, phone, emergencyContact, address]
      properties:
        cpf:
          type: string
          description: Com ou sem pontuação; dígitos verificadores válidos e não usado por outro usuário. Gravado só com os dígitos.
          example: 529.982.247-25
        birthDate:
          type: string
          format: date
          description: Data real, idade mínima de 18 anos
          example: '1990-05-10'
        phone: { $ref: '#/components/schemas/Phone' }
        emergencyContact:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name: { type: string, minLength: 1, maxLength: 255 }
            phone: { $ref: '#/components/schemas/Phone' }
        address:
          type: object
          additionalProperties: false
          required: [zipCode, street, number, neighborhood, city, state]
          properties:
            zipCode:
              type: string
              pattern: '^\d{5}-?\d{3}$'
              description: Com ou sem hífen [assunção]; gravado sem
              example: 01001-000
            street: { type: string, minLength: 1, maxLength: 255 }
            number: { type: string, minLength: 1, maxLength: 20 }
            complement: { type: [string, 'null'], maxLength: 100 }
            neighborhood: { type: string, minLength: 1, maxLength: 100 }
            city: { type: string, minLength: 1, maxLength: 100 }
            state:
              type: string
              pattern: '^[A-Za-z]{2}$'
              description: Sigla da UF; gravada em maiúsculas
              example: SP

    Agenda:
      type: object
      required: [startDate, endDate, capacity, days]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Dia seguinte ao último; não entra }
        capacity: { type: integer, description: 'hotel_details.capacity, ou 1 se não cadastrada', example: 1 }
        days:
          type: array
          items: { $ref: '#/components/schemas/AgendaDay' }

    AgendaDay:
      type: object
      required: [date, status, occupied]
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [free, blocked, occupied] }
        occupied: { type: integer, description: 'Reservas aguardando pagamento, aceitas ou em andamento no dia', example: 0 }
        block:
          type: object
          description: Só nos dias bloqueados
          properties:
            id: { type: string, format: uuid, description: 'Para o DELETE /api/v1/me/host/agenda/blocks/{id}' }
            reason: { type: [string, 'null'] }

    BlockInput:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date, description: 'Primeiro dia bloqueado, a partir de hoje' }
        endDate: { type: string, format: date, description: 'Dia seguinte ao último bloqueado; até 365 dias depois de startDate' }
        reason: { type: [string, 'null'], maxLength: 500 }

    Block:
      type: object
      required: [id, date, reason]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        reason: { type: [string, 'null'] }

    HostSearchResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HostOffer' }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, description: 'Total de ofertas com os filtros, em todas as páginas', example: 1 }

    HostOffer:
      type: object
      description: Um serviço ativo de um Host elegível. Mesmos nomes do HostDetails
      required: [hostId, serviceId, name, serviceName, dailyPrice, pictureUrl, location, reputation]
      properties:
        hostId: { type: string, format: uuid, description: 'Para o GET /api/v1/hosts/{id}' }
        serviceId: { type: string, format: uuid, description: Para o POST /api/v1/reservations }
        name: { type: string, example: Hotelzinho do Rex }
        serviceName: { type: string, example: Diária }
        dailyPrice: { type: number, example: 95 }
        pictureUrl: { type: [string, 'null'], description: 'Foto de perfil. Pode ser um link temporário: não guardar para usar depois' }
        location:
          type: object
          description: Só cidade e bairro; nunca rua, número ou CEP
          properties:
            city: { type: [string, 'null'], example: São Paulo }
            neighborhood: { type: [string, 'null'], example: Bela Vista }
        reputation:
          type: object
          properties:
            rating: { type: [number, 'null'], example: 4.5 }
            reviewCount: { type: integer, example: 12 }

    HostAddress:
      type: object
      additionalProperties: false
      required: [zipCode, street, number, neighborhood, city, state]
      properties:
        zipCode:
          type: string
          pattern: '^\d{5}-?\d{3}$'
          description: Com ou sem hífen; gravado sem
          example: 01001-000
        street: { type: string, minLength: 1, maxLength: 255 }
        number: { type: string, minLength: 1, maxLength: 20 }
        complement: { type: [string, 'null'], maxLength: 100 }
        neighborhood: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, pattern: '^[A-Za-z]{2}$', example: SP }

    CareProviderDraftInput:
      type: object
      additionalProperties: false
      required: [providerType, name]
      properties:
        providerType: { type: string, enum: [pet_sitter, pet_walker] }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        personType: { type: string, enum: [pf, pj] }
        cpfCnpj: { type: [string, 'null'], description: CPF ou CNPJ válido, único e coerente com personType }
        address: { $ref: '#/components/schemas/HostAddress' }
        kilometerRadius: { type: number, exclusiveMinimum: 0, maximum: 9999.99, multipleOf: 0.01 }
        administersMedication: { type: boolean }
        experienceRange: { type: string, enum: [lt_1, '1_3', gt_3] }
        acceptedSpecies: { type: array, items: { type: string, enum: [dog, cat] } }
        acceptedSizes: { type: array, items: { type: string, enum: [small, medium, large] } }
        acceptedBreeds: { type: array, items: { type: string, minLength: 1, maxLength: 100 } }

    CareProviderProfile:
      type: object
      required: [id, providerType, validationStatus, name, personType, description, cpfCnpjMasked, address, kilometerRadius, administersMedication, experienceRange, acceptedSpecies, acceptedSizes, acceptedBreeds, documents, photos]
      properties:
        id: { type: string, format: uuid }
        providerType: { type: string, enum: [pet_sitter, pet_walker] }
        validationStatus: { type: string, enum: [draft, pending, approved, rejected] }
        rejectionReason: { type: [string, 'null'] }
        name: { type: string }
        personType: { type: [string, 'null'], enum: [pf, pj, null] }
        description: { type: [string, 'null'] }
        cpfCnpjMasked: { type: [string, 'null'] }
        address: { oneOf: [{ $ref: '#/components/schemas/HostAddress' }, { type: 'null' }] }
        kilometerRadius: { type: [number, 'null'] }
        administersMedication: { type: [boolean, 'null'] }
        experienceRange: { type: [string, 'null'] }
        acceptedSpecies: { type: array, items: { type: string } }
        acceptedSizes: { type: array, items: { type: string } }
        acceptedBreeds: { type: array, items: { type: string } }
        documents: { type: array, items: { $ref: '#/components/schemas/HostDocument' } }
        photos: { type: array, items: { $ref: '#/components/schemas/HostPhoto' } }

    HostDraftInput:
      type: object
      additionalProperties: false
      required: [providerType, name]
      properties:
        providerType: { type: string, enum: [hotel] }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        cpfCnpj: { type: [string, 'null'], description: CPF ou CNPJ válido e ainda não usado por outro prestador; com ou sem pontuação }
        address: { $ref: '#/components/schemas/HostAddress' }
        capacity: { type: integer, minimum: 1, maximum: 1000, description: Quantos pets o hotel recebe ao mesmo tempo. Usada na agenda e na busca }
        acceptedSpecies: { type: array, items: { type: string, enum: [dog, cat] } }
        acceptedSizes: { type: array, items: { type: string, enum: [small, medium, large] } }
        acceptedBreeds: { type: array, description: Vazia = aceita todas as raças, items: { type: string, minLength: 1, maxLength: 100 } }

    HostDocument:
      type: object
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [identity, proof_of_address, cnpj_card, qualification] }

    HostPhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: 'Pode ser um link temporário: não guardar para usar depois' }

    HostProfile:
      type: object
      required: [id, validationStatus, rejectionReason, providerType, name, description, cpfCnpjMasked, address, capacity, acceptedSpecies, acceptedSizes, acceptedBreeds, documents, photos]
      properties:
        id: { type: string, format: uuid }
        validationStatus: { type: string, enum: [draft, pending, approved, rejected] }
        rejectionReason: { type: [string, 'null'], description: 'Motivo da reprovação do Administrador (#404). `null` fora de `rejected`' }
        providerType: { type: string, enum: [hotel] }
        name: { type: string }
        description: { type: [string, 'null'] }
        cpfCnpjMasked: { type: [string, 'null'], description: Só os 4 últimos dígitos, example: '***4725' }
        address:
          oneOf:
            - { $ref: '#/components/schemas/HostAddress' }
            - { type: 'null' }
        capacity: { type: [integer, 'null'] }
        acceptedSpecies: { type: array, items: { type: string } }
        acceptedSizes: { type: array, items: { type: string } }
        acceptedBreeds: { type: array, items: { type: string } }
        documents: { type: array, items: { $ref: '#/components/schemas/HostDocument' } }
        photos: { type: array, items: { $ref: '#/components/schemas/HostPhoto' } }

    CareWorkingHour:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo' }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    CareAvailabilityInput:
      type: object
      additionalProperties: false
      required: [serviceCity, serviceNeighborhoods, workingHours, price]
      properties:
        serviceCity: { type: string, minLength: 1, maxLength: 100 }
        serviceNeighborhoods: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 100 }, description: 'Vazia = cidade inteira' }
        workingHours: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CareWorkingHour' } }
        price: { type: number, exclusiveMinimum: 0, maximum: 99999999.99, description: 'Por visita (Sitter) ou passeio (Walker), em reais' }
        durationWalkMinutes: { type: integer, minimum: 1, maximum: 1440, description: 'Obrigatório para Walker; proibido para Sitter' }

    CareAvailability:
      type: object
      required: [providerType, serviceCity, serviceNeighborhoods, workingHours, price, durationWalkMinutes, busyIntervals]
      properties:
        providerType: { type: string, enum: [pet_sitter, pet_walker] }
        serviceCity: { type: [string, 'null'], description: 'Null antes da primeira configuração' }
        serviceNeighborhoods: { type: array, items: { type: string } }
        workingHours: { type: array, items: { $ref: '#/components/schemas/CareWorkingHour' } }
        price: { type: [number, 'null'] }
        durationWalkMinutes: { type: [integer, 'null'] }
        busyIntervals:
          type: array
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime: { type: string, example: '09:00' }
              endTime: { type: string, example: '10:00' }

    CareSearchResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [providerId, serviceId, providerType, name, price, serviceCity, serviceNeighborhoods, durationWalkMinutes]
            properties:
              providerId: { type: string, format: uuid }
              serviceId: { type: string, format: uuid }
              providerType: { type: string, enum: [pet_sitter, pet_walker] }
              name: { type: string }
              price: { type: number }
              serviceCity: { type: string }
              serviceNeighborhoods: { type: array, items: { type: string } }
              durationWalkMinutes: { type: [integer, 'null'] }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ProviderValidationDecision:
      type: object
      required: [providerId, validationStatus, decidedAt, rejectionReason]
      properties:
        providerId: { type: string, format: uuid }
        validationStatus: { type: string, enum: [approved, rejected] }
        decidedAt: { type: string, format: date-time }
        rejectionReason: { type: [string, 'null'], description: '`null` na aprovação' }

    ProviderValidationItem:
      type: object
      required: [providerId, providerType, name, submittedAt, documentCount, photoCount]
      properties:
        providerId: { type: string, format: uuid }
        providerType: { type: string, enum: [hotel, pet_sitter, pet_walker] }
        name: { type: string }
        submittedAt:
          type: [string, 'null']
          format: date-time
          description: Quando o cadastro foi enviado para validação. `null` só em cadastro pendente que não passou pelo envio; esses ficam no fim da fila
        documentCount: { type: integer }
        photoCount: { type: integer }

    ProtectedDocument:
      type: object
      required: [id, type, url, expiresIn]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [identity, proof_of_address, cnpj_card] }
        url: { type: string, description: Link temporário para o arquivo. Não guardar }
        expiresIn: { type: integer, description: Validade do link em segundos, example: 300 }

    ProviderValidationDetail:
      type: object
      required: [providerId, providerType, name, submittedAt, cpfCnpjMasked, description, acceptedSpecies, acceptedSizes, acceptedBreeds, capacity, address, photos, documents]
      properties:
        providerId: { type: string, format: uuid }
        providerType: { type: string, enum: [hotel, pet_sitter, pet_walker] }
        name: { type: string }
        submittedAt: { type: [string, 'null'], format: date-time }
        cpfCnpjMasked: { type: [string, 'null'], description: Só os 4 últimos dígitos, example: '***1234' }
        description: { type: [string, 'null'] }
        acceptedSpecies: { type: array, items: { type: string } }
        acceptedSizes: { type: array, items: { type: string } }
        acceptedBreeds: { type: array, items: { type: string } }
        capacity: { type: [integer, 'null'] }
        address:
          type: [object, 'null']
          description: Sem rua e sem número
          required: [city, state, neighborhood, zipCode]
          properties:
            city: { type: string, example: São Paulo }
            state: { type: string, example: SP }
            neighborhood: { type: string }
            zipCode: { type: string, example: '01234000' }
        photos: { type: array, items: { $ref: '#/components/schemas/HostPhoto' } }
        documents: { type: array, items: { $ref: '#/components/schemas/ProtectedDocument' } }

    AdminUserItem:
      type: object
      required: [id, name, emailMasked, accountType, roles, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        emailMasked: { type: string, description: Só a primeira letra e o domínio, example: l***@outlook.com.br }
        accountType: { type: string, enum: [user, admin] }
        roles:
          type: array
          description: Vazia quando o usuário ainda não tem perfil nem papel
          items: { type: string, enum: [tutor, provider, admin] }
        status: { type: string, enum: [active, blocked, suspended, pending], description: '[assunção] valores de hoje; a #413 revê os estados da conta.' }
        createdAt: { type: string, format: date-time }

    AdminUserDetail:
      type: object
      required: [id, name, emailMasked, accountType, status, profileStatus, roles, createdAt, tutor, provider, contracts, penalties]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        emailMasked: { type: string, example: l***@outlook.com.br }
        accountType: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, blocked, suspended, pending], description: '[assunção] valores de hoje; a #413 revê os estados da conta.' }
        profileStatus: { type: string, enum: [incomplete, complete] }
        roles: { type: array, items: { type: string, enum: [tutor, provider, admin] } }
        createdAt: { type: string, format: date-time }
        tutor:
          type: [object, 'null']
          description: '`null` quando o usuário não é Tutor'
          required: [cpfMasked, phoneMasked]
          properties:
            cpfMasked: { type: [string, 'null'], description: Só os 4 últimos dígitos, example: '***1234' }
            phoneMasked: { type: [string, 'null'], description: Só os 4 últimos dígitos, example: '***4321' }
        provider:
          type: [object, 'null']
          description: '`null` quando o usuário não tem cadastro de prestador'
          required: [id, providerType, validationStatus, cpfCnpjMasked]
          properties:
            id: { type: string, format: uuid }
            providerType: { type: string, enum: [hotel, pet_sitter, pet_walker] }
            validationStatus: { type: string, enum: [draft, pending, approved, rejected] }
            cpfCnpjMasked: { type: [string, 'null'], description: Só os 4 últimos dígitos, example: '***0001' }
        contracts:
          type: array
          description: As 20 solicitações mais recentes, da mais nova para a mais antiga
          items:
            type: object
            required: [id, as, status, startDate, totalValue]
            properties:
              id: { type: string, format: uuid }
              as: { type: string, enum: [tutor, provider], description: Lado do usuário na contratação }
              status: { type: string, enum: [requested, awaiting_payment, accepted, rejected, checked_in, checked_out, cancelled, completed] }
              startDate: { type: string, format: date, example: '2026-11-20' }
              totalValue: { type: number, example: 240 }
        penalties:
          type: array
          description: Da mais nova para a mais antiga
          items:
            type: object
            required: [id, type, reason, createdAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [warning, fine, suspension, ban], description: '[assunção] `fine` pode aparecer e hoje sai sem valor; a #413 revê o modelo de penalidades.' }
              reason: { type: string }
              createdAt: { type: string, format: date-time }

    HostDetails:
      type: object
      required: [id, name, description, pictureUrl, location, photos, accepts, services, reputation]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Nome de exibição }
        description: { type: [string, 'null'], maxLength: 2000 }
        pictureUrl: { type: [string, 'null'], description: 'Foto de perfil. Pode ser um link temporário: não guardar para usar depois' }
        location:
          type: object
          description: Só cidade e bairro; nunca rua, número ou CEP
          properties:
            city: { type: [string, 'null'] }
            neighborhood: { type: [string, 'null'] }
        photos:
          type: array
          description: 'URLs das fotos, da mais antiga para a mais nova. Podem ser links temporários: não guardar para usar depois'
          items: { type: string }
        accepts:
          type: object
          description: Mesmos valores de espécie, porte e raça do pet. `breeds` vazio = aceita todas as raças
          properties:
            species: { type: array, items: { type: string } }
            sizes: { type: array, items: { type: string } }
            breeds: { type: array, items: { type: string } }
        services:
          type: array
          description: Serviços ativos, do mais barato para o mais caro
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              price: { type: number, description: Preço vigente em reais }
        reputation:
          type: object
          properties:
            rating: { type: [number, 'null'], minimum: 0, maximum: 5, description: '`null` sem avaliações' }
            reviewCount: { type: integer }
      example:
        id: 3f1c2a9e-6b1d-4c3e-9a51-2f0f6d1b7c11
        name: Hotelzinho da Ana
        description: Casa com quintal, aceito pets de pequeno e médio porte.
        pictureUrl: https://exemplo.com/fotos/perfil.jpg
        location: { city: São Paulo, neighborhood: Pinheiros }
        photos: ['https://exemplo.com/fotos/1.jpg']
        accepts: { species: [dog, cat], sizes: [small, medium], breeds: [] }
        services: [{ id: 7a0b5c3d-1e2f-4a6b-8c9d-0e1f2a3b4c5d, name: Diária, price: 120 }]
        reputation: { rating: 4.8, reviewCount: 12 }

    ReservationInput:
      type: object
      additionalProperties: false
      required: [serviceId, petId, startDate, endDate]
      properties:
        serviceId: { type: string, format: uuid, description: Serviço ativo de um Host elegível; o Host vem dele }
        petId: { type: string, format: uuid, description: Pet ativo do próprio Tutor }
        startDate: { type: string, format: date, description: Dia da entrada; hoje ou depois (dia em UTC) }
        endDate: { type: string, format: date, description: Dia da saída; depois de startDate. Noites = endDate - startDate }
        notes: { type: [string, 'null'], maxLength: 1000, description: Observações do Tutor para o Host }
      example:
        serviceId: 7a0b5c3d-1e2f-4a6b-8c9d-0e1f2a3b4c5d
        petId: 2c1d0e9f-8a7b-4c6d-9e5f-1a2b3c4d5e6f
        startDate: '2026-11-10'
        endDate: '2026-11-13'
        notes: Toma remédio às 8h

    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested], description: '`requested` = pendente, aguardando o Host' }
        hostId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dailyPrice: { type: number, description: Diária no momento da solicitação (snapshot) }
        totalValue: { type: number, description: dailyPrice × noites (snapshot) }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    HostReservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, accepted, checked_in] }
        serviceId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        dailyPrice: { type: [number, 'null'], description: Diária no momento da solicitação (snapshot) }
        totalValue: { type: number, description: Valor total no momento da solicitação (snapshot) }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, description: Presente após um check-in registrado }
        tutor:
          type: object
          description: Telefone e endereço só aparecem em uma reserva em andamento com check-in registrado.
          properties:
            name: { type: string }
            phone: { type: [string, 'null'] }
            address:
              type: [object, 'null']
              properties:
                zipCode: { type: string }
                street: { type: string }
                number: { type: string }
                complement: { type: [string, 'null'] }
                neighborhood: { type: string }
                city: { type: string }
                state: { type: string }
        pet:
          type: object
          properties:
            name: { type: string }
            species: { type: string }
            size: { type: [string, 'null'] }
            breed: { type: [string, 'null'] }
            medicalNotes: { type: [string, 'null'] }
            behavioralNotes: { type: [string, 'null'] }

    ReservationDecision:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment, rejected] }
        decidedAt: { type: string, format: date-time }
        rejectionReason: { type: [string, 'null'] }

    PetInput:
      type: object
      additionalProperties: false
      required: [name, species]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        species:
          type: string
          enum: [dog, cat]
          description: Lista provisória até a aprovação dos domínios (alinhar com o Host, #110)
        breed: { type: [string, 'null'], maxLength: 100 }
        size:
          type: [string, 'null']
          enum: [small, medium, large, null]
        birthDate:
          type: [string, 'null']
          format: date
          description: Data real, não pode ser no futuro
          example: '2020-03-15'
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }
        behavioralNotes: { type: [string, 'null'], maxLength: 2000 }

    Pet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        species: { type: string, enum: [dog, cat] }
        breed: { type: [string, 'null'] }
        size: { type: [string, 'null'], enum: [small, medium, large, null] }
        birthDate: { type: [string, 'null'], format: date }
        medicalNotes: { type: [string, 'null'] }
        behavioralNotes: { type: [string, 'null'] }
    Conversation:
      type: object
      description: Conversa da contratação (#548)
      required: [id, contractId, participants, open, createdAt]
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        participants:
          type: object
          properties:
            tutor: { type: object, properties: { name: { type: string } } }
            host: { type: object, properties: { name: { type: string } } }
        open: { type: boolean, description: '`false` em contratação concluída, recusada ou cancelada: só leitura' }
        createdAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      required: [id, author, text, sentAt]
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          properties:
            role: { type: string, enum: [tutor, host] }
            name: { type: [string, 'null'] }
        text: { type: string }
        sentAt: { type: string, format: date-time }
    MyContract:
      type: object
      description: Uma contratação na lista do Tutor (#533)
      required: [id, type, status, statusLabel, provider, pet, startDate, endDate, totalValue]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [hospedagem, visita, passeio] }
        status: { type: string, enum: [requested, awaiting_payment, accepted, checked_in, checked_out, completed, rejected, cancelled] }
        statusLabel:
          type: string
          description: 'Nome oficial do Glossário: Aguardando aceite, Aguardando pagamento, Confirmada, Em andamento, Concluída (checked_out e completed), Recusada ou Cancelada'
          example: Aguardando pagamento
        provider: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        pet: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        totalValue: { type: number, description: Valor total da contratação (snapshot da solicitação), example: 240.1 }
    ContractPayment:
      type: object
      description: Resultado da tentativa de pagamento (#530). Nunca traz dado do cartão
      required: [transactionId, status, amount, failureCode, createdAt, reservationStatus]
      properties:
        transactionId: { type: string, format: uuid, description: Referência da tentativa (comprovante) }
        status: { type: string, enum: [pending, approved, rejected] }
        amount: { type: number, description: Valor cobrado em reais, o snapshot da contratação, example: 240.1 }
        failureCode: { type: [string, 'null'], description: 'Motivo da recusa (ex.: `card_declined`)' }
        createdAt: { type: string, format: date-time, description: Início da tentativa }
        reservationStatus: { type: string, description: 'Status da contratação no momento; `accepted` só depois do webhook', example: awaiting_payment }
    PaymentTransaction:
      type: object
      description: |
        Uma tentativa de pagamento de uma contratação (#527, ADR-016). Nunca traz dado do cartão.
        [assunção] A "rota interna" do card virou serviço (`createPaymentIntentService`): a rota HTTP que devolve este schema é a de pagar a contratação (#530).
      required: [id, status, amount, createdAt]
      properties:
        id: { type: string, format: uuid, description: Referência do comprovante }
        status:
          type: string
          enum: [pending, approved, rejected]
          description: '`pending`: aguardando o resultado do gateway (3D Secure, processamento ou timeout); a confirmação chega pelo webhook'
        amount: { type: number, description: Valor cobrado em reais, o snapshot da contratação, example: 240.1 }
        failureCode: { type: [string, 'null'], description: 'Motivo da recusa devolvido pelo gateway (ex.: `card_declined`)' }
        createdAt: { type: string, format: date-time }

  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: Id da solicitação; texto que não é UUID responde 404
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Todos os campos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TokenInvalid:
      description: '`TOKEN_INVALID`: cabeçalho ausente, token mal formado, assinatura errada, expirado ou iss/aud diferente'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UserNotFound:
      description: '`USER_NOT_FOUND`: token válido, mas sem USER com esse authUserId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: '`INTERNAL_ERROR`: falha inesperada'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotTutor:
      description: '`PROFILE_INCOMPLETE`: o usuário ainda não é Tutor (perfil não concluído), então não tem pets'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: PROFILE_INCOMPLETE, message: Complete seu perfil antes de cadastrar um pet. }
    NotHost:
      description: '`HOST_REQUIRED`: o usuário não é Host'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: HOST_REQUIRED, message: Apenas Hosts acessam as solicitações recebidas. }
    ProviderIdInvalid:
      description: '`VALIDATION_ERROR`: `providerId` não é UUID'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example: { code: VALIDATION_ERROR, message: Parâmetros inválidos, details: [{ field: providerId, message: UUID obrigatório }] }
    ProviderNotFound:
      description: '`NOT_FOUND`: cadastro inexistente ou ainda em rascunho. `USER_NOT_FOUND`: usuário não encontrado'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Cadastro não encontrado }
    ProviderAlreadyDecided:
      description: '`PROVIDER_ALREADY_DECIDED`: já aprovado ou reprovado, inclusive quando outra decisão chegou antes ao mesmo tempo'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: PROVIDER_ALREADY_DECIDED, message: O cadastro já foi decidido }
    NotAdmin:
      description: '`ADMIN_REQUIRED`: o usuário não tem o papel Administrador'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: ADMIN_REQUIRED, message: Apenas Administradores acessam esta rota. }
    HostFileConflict:
      description: '`HOST_ALREADY_SUBMITTED`: o cadastro já foi enviado e não aceita arquivos. `FILE_LIMIT_REACHED`: limite de arquivos atingido'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StorageUnavailable:
      description: '`STORAGE_UNAVAILABLE`: o armazenamento de arquivos falhou. Pode tentar de novo'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentGatewayUnavailable:
      description: '`PAYMENT_GATEWAY_UNAVAILABLE`: o gateway de pagamento não respondeu. Reenvie com a mesma chave de idempotência: não há cobrança duplicada'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ReservationNotFound:
      description: '`NOT_FOUND`: solicitação inexistente ou de outro Host (mesma resposta, para não revelar que existe)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Solicitação não encontrada }
    PetNotFound:
      description: '`NOT_FOUND`: id inválido, pet inexistente, de outro Tutor ou já desativado (mesma resposta, para não revelar que existe)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Pet não encontrado }
    ContractForbidden:
      description: |
        Não pode contratar. A conta restrita é conferida antes do perfil:
        `ACCOUNT_RESTRICTED` para conta blocked ou suspended; `PROFILE_INCOMPLETE` para perfil que não está complete.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            profileIncomplete:
              value: { code: PROFILE_INCOMPLETE, message: Complete seu perfil antes de contratar um serviço. }
            accountRestricted:
              value: { code: ACCOUNT_RESTRICTED, message: Conta bloqueada ou suspensa }
    NotImplemented:
      description: '`NOT_IMPLEMENTED`: passou pela guarda de contratação, mas a criação ainda não existe (provisório)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_IMPLEMENTED, message: Contratação ainda não disponível }

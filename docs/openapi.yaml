openapi: 3.1.0
info:
  title: Hospetse Back-end
  version: 0.1.0
  description: |
    API do back-end do Hospetse. O README traz o contexto de cada rota (decisões, idempotência, pendências).
    Erros seguem `{ code, message, details? }`; o formato definitivo depende da #56.

    **Autenticação (#298):** tudo sob `/api/v1` é protegido por padrão, antes de chegar na rota.
    `/api/v1/internal/*` exige o token de serviço do Auth; o resto exige o JWT do usuário.
    Sem autenticação válida, qualquer caminho sob `/api/v1` responde `401`, inclusive os que não existem.

    **Inventário das rotas públicas** (as únicas com `security: []`): `GET /health`, `GET /health/ready`,
    `GET /docs` (esta documentação) e `GET /docs/openapi.yaml` (este arquivo).
    Uma rota pública nova precisa entrar aqui e na lista `PUBLIC_ROUTES` do `test/auth-guard.test.js`.
servers:
  - url: https://backend-production-7298.up.railway.app
    description: Produção (Railway)
  - url: http://localhost:3000
    description: Desenvolvimento local

# Padrão: JWT do usuário. As rotas públicas e a interna declaram o próprio security.
security:
  - userJwt: []

tags:
  - name: Saúde
    description: Liveness e readiness
  - name: Documentação
    description: Esta documentação
  - name: Interno
    description: Chamadas só pelo Auth Server
  - name: Usuário
    description: Rotas do app, autenticadas pelo JWT do usuário
  - name: Host
    description: Consulta de Hosts pelo Tutor e rotas do próprio Host
  - name: Contratação
    description: Exigem conta ativa e perfil complete (#263). service-requests e checkout seguem provisórias até as tasks de reserva e checkout

paths:
  /health:
    get:
      tags: [Saúde]
      operationId: getHealth
      summary: Liveness
      description: Só confirma que o processo responde; não acessa o banco.
      security: []
      responses:
        '200':
          description: Processo no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: Server is running }

  /health/ready:
    get:
      tags: [Saúde]
      operationId: getReadiness
      summary: Readiness
      description: Executa `SELECT 1` no banco com limite de 2 segundos; nunca escreve.
      security: []
      responses:
        '200':
          description: Banco respondendo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  database: { type: string, example: ok }
        '503':
          description: Banco indisponível ou lento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  database: { type: string, example: unavailable }

  /docs:
    get:
      tags: [Documentação]
      operationId: getDocs
      summary: Página do Swagger UI com este contrato
      security: []
      responses:
        '200':
          description: Página HTML
          content:
            text/html:
              schema: { type: string }

  /docs/openapi.yaml:
    get:
      tags: [Documentação]
      operationId: getOpenApi
      summary: Este contrato em YAML
      security: []
      responses:
        '200':
          description: OpenAPI 3.1
          content:
            text/yaml:
              schema: { type: string }

  /api/v1/internal/users/{authUserId}:
    put:
      tags: [Interno]
      operationId: provisionUser
      summary: Provisiona o USER a partir do Auth Server (#259)
      description: Idempotente pelo `authUserId`. A autenticação é verificada antes do body.
      security:
        - serviceToken: []
      parameters:
        - name: authUserId
          in: path
          required: true
          description: '`user_auth.id` do Auth, que também vai no `sub` do JWT'
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: USER criado agora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionedUser' }
        '200':
          description: USER já existia com o mesmo authUserId e e-mail (retentativa)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`SERVICE_TOKEN_INVALID`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`EMAIL_ALREADY_IN_USE` ou `AUTH_USER_ID_CONFLICT`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me:
    get:
      tags: [Usuário]
      operationId: getMe
      summary: Estado do usuário e do perfil (#262)
      security:
        - userJwt: []
      responses:
        '200':
          description: Token válido e USER encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      authUserId: { type: string, format: uuid }
                      email: { type: string, format: email }
                      name: { type: string }
                  profile:
                    type: object
                    properties:
                      status: { type: string, enum: [incomplete, complete] }
                      missingFields:
                        type: array
                        description: Campos do perfil do Tutor ainda vazios; sem TUTOR, todos aparecem
                        items: { type: string, enum: [cpf, birthDate, phone, address, emergencyContact] }
                  permissions:
                    type: object
                    properties:
                      canSearch: { type: boolean }
                      canContract:
                        type: boolean
                        description: '`true` só com perfil complete e conta que não esteja blocked ou suspended'
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /api/v1/me/tutor-profile:
    put:
      tags: [Usuário]
      operationId: putTutorProfile
      summary: Conclui ou edita o perfil do Tutor (#275)
      description: |
        Grava endereço, Tutor e USER `complete` em uma transação. Na primeira chamada cria o TUTOR; nas seguintes, atualiza.
        O usuário vem só do `sub` do JWT. Depois do `204`, o app chama o `/me`.
      security:
        - userJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TutorProfile' }
      responses:
        '204':
          description: Perfil gravado e marcado como complete. Sem corpo (o CPF nunca volta em resposta).
        '400':
          description: Todos os campos inválidos, incluindo CPF já usado por outro usuário. O valor recebido não volta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: cpf, message: CPF já cadastrado }
                  - { field: birthDate, message: idade mínima de 18 anos }
                  - { field: address.zipCode, message: deve ter 8 dígitos }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/hosts/{id}:
    get:
      tags: [Host]
      operationId: getHostDetails
      summary: Detalhes públicos de um Host (#479)
      description: |
        Dados que o Tutor vê antes de solicitar. Só Host elegível: `provider_type` hotel, `status` active e `validation_status` approved.
        Documentos, CPF/CNPJ, e-mail, telefone e endereço completo nunca aparecem (LGPD).
      security:
        - userJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Host elegível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetails' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '404':
          description: |
            `NOT_FOUND`: Host inexistente, pendente, rejeitado, inativo ou id fora do formato UUID. A mesma resposta para todos,
            para não revelar que o Host existe. Também `USER_NOT_FOUND`, quando o token é válido mas não há USER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: Host não encontrado }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/pets:
    post:
      tags: [Usuário]
      operationId: createPet
      summary: Cadastra um pet do Tutor (#369)
      description: |
        Exige ser Tutor (perfil concluído pelo `PUT /api/v1/me/tutor-profile`). O pet fica vinculado ao Tutor do `sub` do JWT;
        um `tutorId` no body é recusado como campo fora do contrato.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '201':
          description: Pet criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: Todos os campos inválidos, incluindo valor fora do domínio. Nenhum pet é criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: species, message: 'um de: dog, cat' }
                  - { field: birthDate, message: não pode ser no futuro }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Usuário]
      operationId: listPets
      summary: Lista os pets ativos do Tutor (#369)
      description: Só os pets do Tutor do `sub` do JWT; nunca de outro Tutor.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de pets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Pet' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de pets ativos do Tutor }
        '400':
          description: '`page` ou `pageSize` fora do intervalo'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotTutor' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Rotas do próprio Host: JWT do usuário → controller (exige ser Host).
  /api/v1/me/host/reservations:
    get:
      tags: [Host]
      operationId: listHostReservations
      summary: Lista as solicitações pendentes recebidas pelo Host (#485)
      description: |
        Só as solicitações dos serviços do Host do `sub` do JWT, da mais antiga para a mais nova.
        Do Tutor sai só o nome de exibição (LGPD).
      parameters:
        - name: status
          in: query
          description: Por enquanto só `requested` (pendente)
          schema: { type: string, enum: [requested], default: requested }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de solicitações; lista vazia quando não há pendentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostReservation' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer, description: Total de solicitações do Host nesse status }
        '400':
          description: '`status`, `page` ou `pageSize` inválidos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/reservations/{id}/accept:
    post:
      tags: [Host]
      operationId: acceptHostReservation
      summary: Aceita uma solicitação pendente (#491)
      description: |
        Vai para `awaiting_payment` (aguardando o pagamento do Tutor, HSP-DEC-004) se ainda houver vaga no período.
        Ocupam vaga as reservas do Host em `awaiting_payment`, `accepted` ou `checked_in` que cruzam o período (o dia da saída não conta).
        Host sem capacidade cadastrada atende um pet por vez [provisório].
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Solicitação aceita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDecision' }
              example: { id: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, status: awaiting_payment, decidedAt: '2026-10-30T12:00:00.000Z', rejectionReason: null }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/ReservationNotFound' }
        '409':
          description: |
            `RESERVATION_ALREADY_DECIDED`: já aceita ou recusada, inclusive quando outra decisão chegou antes ao mesmo tempo.
            `NO_CAPACITY`: sem vaga no período.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/host/reservations/{id}/reject:
    post:
      tags: [Host]
      operationId: rejectHostReservation
      summary: Recusa uma solicitação pendente com motivo (#491)
      description: Vai para `rejected` e registra o evento `reservation_rejected` para o Tutor na mesma transação (entrega pela FT-026).
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
            example: { reason: Lotado no feriado }
      responses:
        '200':
          description: Solicitação recusada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDecision' }
              example: { id: 6f1c2d3e-4b5a-4c6d-8e9f-0a1b2c3d4e5f, status: rejected, decidedAt: '2026-10-30T12:00:00.000Z', rejectionReason: Lotado no feriado }
        '400':
          description: '`reason` ausente, vazio ou com mais de 500 caracteres, ou campo fora do contrato'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/NotHost' }
        '404': { $ref: '#/components/responses/ReservationNotFound' }
        '409':
          description: '`RESERVATION_ALREADY_DECIDED`: já aceita ou recusada'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # Contratação (#263): JWT do usuário → guarda de conta e perfil (só no POST) → controller.
  /api/v1/reservations:
    post:
      tags: [Contratação]
      operationId: createReservation
      summary: Solicita hospedagem de um pet num serviço de um Host (#494)
      description: |
        Cria a solicitação no estado `requested` (pendente, HSP-DEC-004), com o snapshot da diária e do total (diária × noites).
        O Tutor vem só do `sub` do JWT. O pet precisa ser ativo, do próprio Tutor e aceito pelo Host (espécie, porte e raça;
        lista vazia no Host = aceita tudo). O serviço precisa estar ativo e ser de um Host elegível (o mesmo filtro do `GET /hosts/{id}`).
        Reenviar com a mesma `Idempotency-Key` devolve a mesma solicitação (`200`), sem criar outra.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Gerada pelo app para cada intenção de solicitar e repetida nos reenvios. Até 100 letras, números, `-` ou `_`
          schema: { type: string, pattern: '^[\w-]{1,100}$' }
          example: 9b2f6c1e-4d3a-4f7b-a1c2-3e4d5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '200':
          description: Reenvio da mesma intenção (mesma chave, mesmo body); devolve a solicitação já criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400':
          description: |
            Todos os campos inválidos, incluindo o header `Idempotency-Key`, serviço ou pet inexistentes e pet não aceito pelo Host.
            Pet de outro Tutor responde igual ao inexistente. Nada é gravado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                code: VALIDATION_ERROR
                message: Payload inválido
                details:
                  - { field: petId, message: espécie não aceita pelo Host }
                  - { field: endDate, message: deve ser depois de startDate }
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409':
          description: |
            `PERIOD_UNAVAILABLE`: algum dia do período está bloqueado na agenda do Host (o dia da saída não conta).
            `IDEMPOTENCY_KEY_REUSED`: a mesma `Idempotency-Key` já foi usada para outra intenção (outro serviço, pet, período ou observação).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # shortcut: service-requests e checkout ainda não criam nada e respondem 501 para quem passa pela guarda; as tasks de reserva/checkout definem body e sucesso.

  /api/v1/service-requests:
    post:
      tags: [Contratação]
      operationId: createServiceRequest
      summary: Inicia uma solicitação de serviço (guarda da #263; criação provisória, a #494 substitui)
      description: A regra também é conferida na camada de service. Consultar (GET) não passa pela guarda.
      responses:
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/checkout:
    post:
      tags: [Contratação]
      operationId: createCheckout
      summary: Inicia um checkout (guarda da #263; criação provisória)
      description: A regra também é conferida na camada de service. Consultar (GET) não passa pela guarda.
      responses:
        '401': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/ContractForbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '501': { $ref: '#/components/responses/NotImplemented' }

components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Auth (RS256, iss hospetse-auth-service, aud hospetse-backend). O `sub` é o authUserId.
    serviceToken:
      type: http
      scheme: bearer
      description: INTERNAL_SERVICE_TOKEN compartilhado com o Auth (provisório até a #254).

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ValidationError:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string, const: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: 'Campos aninhados com ponto: address.zipCode' }
              message: { type: string }

    ProvisionedUser:
      type: object
      properties:
        userId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }

    Phone:
      type: string
      pattern: '^\d{10,11}$'
      description: Só dígitos, com DDD, sem +55 [assunção]
      example: '11999999999'

    TutorProfile:
      type: object
      additionalProperties: false
      required: [cpf, birthDate, phone, emergencyContact, address]
      properties:
        cpf:
          type: string
          description: Com ou sem pontuação; dígitos verificadores válidos e não usado por outro usuário. Gravado só com os dígitos.
          example: 529.982.247-25
        birthDate:
          type: string
          format: date
          description: Data real, idade mínima de 18 anos
          example: '1990-05-10'
        phone: { $ref: '#/components/schemas/Phone' }
        emergencyContact:
          type: object
          additionalProperties: false
          required: [name, phone]
          properties:
            name: { type: string, minLength: 1, maxLength: 255 }
            phone: { $ref: '#/components/schemas/Phone' }
        address:
          type: object
          additionalProperties: false
          required: [zipCode, street, number, neighborhood, city, state]
          properties:
            zipCode:
              type: string
              pattern: '^\d{5}-?\d{3}$'
              description: Com ou sem hífen [assunção]; gravado sem
              example: 01001-000
            street: { type: string, minLength: 1, maxLength: 255 }
            number: { type: string, minLength: 1, maxLength: 20 }
            complement: { type: [string, 'null'], maxLength: 100 }
            neighborhood: { type: string, minLength: 1, maxLength: 100 }
            city: { type: string, minLength: 1, maxLength: 100 }
            state:
              type: string
              pattern: '^[A-Za-z]{2}$'
              description: Sigla da UF; gravada em maiúsculas
              example: SP

    HostDetails:
      type: object
      required: [id, name, description, pictureUrl, location, photos, accepts, services, reputation]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Nome de exibição }
        description: { type: [string, 'null'], maxLength: 2000 }
        pictureUrl: { type: [string, 'null'], description: Foto de perfil }
        location:
          type: object
          description: Só cidade e bairro; nunca rua, número ou CEP
          properties:
            city: { type: [string, 'null'] }
            neighborhood: { type: [string, 'null'] }
        photos:
          type: array
          description: URLs das fotos, da mais antiga para a mais nova
          items: { type: string }
        accepts:
          type: object
          description: Mesmos valores de espécie, porte e raça do pet. `breeds` vazio = aceita todas as raças
          properties:
            species: { type: array, items: { type: string } }
            sizes: { type: array, items: { type: string } }
            breeds: { type: array, items: { type: string } }
        services:
          type: array
          description: Serviços ativos, do mais barato para o mais caro
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              price: { type: number, description: Preço vigente em reais }
        reputation:
          type: object
          properties:
            rating: { type: [number, 'null'], minimum: 0, maximum: 5, description: '`null` sem avaliações' }
            reviewCount: { type: integer }
      example:
        id: 3f1c2a9e-6b1d-4c3e-9a51-2f0f6d1b7c11
        name: Hotelzinho da Ana
        description: Casa com quintal, aceito pets de pequeno e médio porte.
        pictureUrl: https://exemplo.com/fotos/perfil.jpg
        location: { city: São Paulo, neighborhood: Pinheiros }
        photos: ['https://exemplo.com/fotos/1.jpg']
        accepts: { species: [dog, cat], sizes: [small, medium], breeds: [] }
        services: [{ id: 7a0b5c3d-1e2f-4a6b-8c9d-0e1f2a3b4c5d, name: Diária, price: 120 }]
        reputation: { rating: 4.8, reviewCount: 12 }

    ReservationInput:
      type: object
      additionalProperties: false
      required: [serviceId, petId, startDate, endDate]
      properties:
        serviceId: { type: string, format: uuid, description: Serviço ativo de um Host elegível; o Host vem dele }
        petId: { type: string, format: uuid, description: Pet ativo do próprio Tutor }
        startDate: { type: string, format: date, description: Dia da entrada; hoje ou depois (dia em UTC) }
        endDate: { type: string, format: date, description: Dia da saída; depois de startDate. Noites = endDate - startDate }
        notes: { type: [string, 'null'], maxLength: 1000, description: Observações do Tutor para o Host }
      example:
        serviceId: 7a0b5c3d-1e2f-4a6b-8c9d-0e1f2a3b4c5d
        petId: 2c1d0e9f-8a7b-4c6d-9e5f-1a2b3c4d5e6f
        startDate: '2026-11-10'
        endDate: '2026-11-13'
        notes: Toma remédio às 8h

    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested], description: '`requested` = pendente, aguardando o Host' }
        hostId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dailyPrice: { type: number, description: Diária no momento da solicitação (snapshot) }
        totalValue: { type: number, description: dailyPrice × noites (snapshot) }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    HostReservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested] }
        serviceId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        dailyPrice: { type: [number, 'null'], description: Diária no momento da solicitação (snapshot) }
        totalValue: { type: number, description: Valor total no momento da solicitação (snapshot) }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        tutor:
          type: object
          description: Só o nome de exibição; CPF, telefone e e-mail não saem (LGPD)
          properties:
            name: { type: string }
        pet:
          type: object
          properties:
            name: { type: string }
            species: { type: string }
            size: { type: [string, 'null'] }
            breed: { type: [string, 'null'] }
            medicalNotes: { type: [string, 'null'] }
            behavioralNotes: { type: [string, 'null'] }

    ReservationDecision:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [awaiting_payment, rejected] }
        decidedAt: { type: string, format: date-time }
        rejectionReason: { type: [string, 'null'] }

    PetInput:
      type: object
      additionalProperties: false
      required: [name, species]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        species:
          type: string
          enum: [dog, cat]
          description: Lista provisória até a aprovação dos domínios (alinhar com o Host, #110)
        breed: { type: [string, 'null'], maxLength: 100 }
        size:
          type: [string, 'null']
          enum: [small, medium, large, null]
        birthDate:
          type: [string, 'null']
          format: date
          description: Data real, não pode ser no futuro
          example: '2020-03-15'
        medicalNotes: { type: [string, 'null'], maxLength: 2000 }
        behavioralNotes: { type: [string, 'null'], maxLength: 2000 }

    Pet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        species: { type: string, enum: [dog, cat] }
        breed: { type: [string, 'null'] }
        size: { type: [string, 'null'], enum: [small, medium, large, null] }
        birthDate: { type: [string, 'null'], format: date }
        medicalNotes: { type: [string, 'null'] }
        behavioralNotes: { type: [string, 'null'] }

  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: Id da solicitação; texto que não é UUID responde 404
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Todos os campos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TokenInvalid:
      description: '`TOKEN_INVALID`: cabeçalho ausente, token mal formado, assinatura errada, expirado ou iss/aud diferente'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UserNotFound:
      description: '`USER_NOT_FOUND`: token válido, mas sem USER com esse authUserId'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: '`INTERNAL_ERROR`: falha inesperada'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotTutor:
      description: '`PROFILE_INCOMPLETE`: o usuário ainda não é Tutor (perfil não concluído), então não tem pets'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: PROFILE_INCOMPLETE, message: Complete seu perfil antes de cadastrar um pet. }
    NotHost:
      description: '`HOST_REQUIRED`: o usuário não é Host'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: HOST_REQUIRED, message: Apenas Hosts acessam as solicitações recebidas. }
    ReservationNotFound:
      description: '`NOT_FOUND`: solicitação inexistente ou de outro Host (mesma resposta, para não revelar que existe)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Solicitação não encontrada }
    ContractForbidden:
      description: |
        Não pode contratar. A conta restrita é conferida antes do perfil:
        `ACCOUNT_RESTRICTED` para conta blocked ou suspended; `PROFILE_INCOMPLETE` para perfil que não está complete.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            profileIncomplete:
              value: { code: PROFILE_INCOMPLETE, message: Complete seu perfil antes de contratar um serviço. }
            accountRestricted:
              value: { code: ACCOUNT_RESTRICTED, message: Conta bloqueada ou suspensa }
    NotImplemented:
      description: '`NOT_IMPLEMENTED`: passou pela guarda de contratação, mas a criação ainda não existe (provisório)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_IMPLEMENTED, message: Contratação ainda não disponível }
